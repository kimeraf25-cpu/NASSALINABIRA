<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FuelPoint</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #1d2b2d;
    }
    .page {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 24px;
    }
    .hero {
      background: url('assets/image-4.svg') center/cover no-repeat;
      min-height: 480px;
      border-radius: 18px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.18);
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      margin-top: 32px;
    }
    .card {
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 10px 28px rgba(0,0,0,0.08);
    }
    .card img {
      display: block;
      width: 100%;
      height: 210px;
      object-fit: cover;
    }
    .card h3 {
      margin: 0;
      padding: 16px 18px 8px;
    }
    .card p {
      margin: 0;
      padding: 0 18px 18px;
      color: #516169;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="hero" aria-label="FuelPoint petrol station"></div>

    <div class="cards">
      <article class="card">
        <img src="assets/image-1.svg" alt="Car wash service">
        <h3>Vehicle care</h3>
        <p>Professional cleaning and care for your car.</p>
      </article>
      <article class="card">
        <img src="assets/image-2.svg" alt="Fuel pumps">
        <h3>Quality fuel</h3>
        <p>Petrol and diesel with quick, reliable service.</p>
      </article>
      <article class="card">
        <img src="assets/image-3.svg" alt="Convenience shop">
        <h3>Convenience shop</h3>
        <p>Snacks, drinks, and essentials for every trip.</p>
      </article>
    </div>
  </div>
</body>
</html>
